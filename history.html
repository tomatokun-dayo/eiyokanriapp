<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; base-uri 'self'; form-action 'none'; object-src 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>離乳食栄養メモ（終了しました）</title>
    <meta name="theme-color" content="#24786a" />
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f7f2;
        --card: #ffffff;
        --text: #1f2a27;
        --muted: #5b6b66;
        --accent: #24786a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141a18;
          --card: #1e2623;
          --text: #e6ece9;
          --muted: #a3b2ad;
          --accent: #5fbfab;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
        line-height: 1.8;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: var(--card);
        border-radius: 16px;
        padding: 28px 24px;
        border-top: 6px solid var(--accent);
      }
      h1 { margin: 0 0 12px; font-size: 1.25rem; }
      p { margin: 0 0 12px; }
      .note { color: var(--muted); font-size: 0.9rem; margin: 0; }
    </style>
  </head>
  <body>
    <main>
      <h1>離乳食栄養メモは終了しました</h1>
      <p>これまで使っていただき、ありがとうございました。</p>
      <p>このアプリは役目を終えたため、提供を終了しました。ホーム画面のアイコンは削除して大丈夫です。</p>
      <p class="note">
        この端末に保存された記録は自動では消えません。消したい場合は、ブラウザの設定からこのサイトのデータを削除してください。
      </p>
    </main>
    <script src="register-sw.js"></script>
  </body>
</html>
